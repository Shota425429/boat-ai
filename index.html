<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOAT AI Ver.4</title><style>body{font-family:system-ui,sans-serif;background:#f2f5fa;margin:0;color:#18243a}header{background:#123d73;color:white;padding:20px}main{max-width:780px;margin:25px auto;padding:16px}.card{background:white;border-radius:14px;padding:22px;box-shadow:0 3px 15px #0001;margin-bottom:16px}select,button{font-size:16px;padding:12px;border-radius:8px;margin:6px;border:1px solid #b8c5d7}button{background:#1664bf;color:white;cursor:pointer}small{color:#52647a}.note{border-left:4px solid #1664bf;padding-left:12px}</style></head><body><header><h2>BOAT AI <small style="color:#dce8f8">Ver.4</small></h2>競艇予想ダッシュボード — 開発用プロトタイプ</header><main><section class="card"><h3>レースを選択</h3><label>会場 <select id="venue"></select></label><label>レース <select id="race"></select></label><p><button id="check">データ取得状況を確認</button></p><p id="status" class="note">データ連携は未設定です。架空の買い目は表示しません。</p></section><section class="card"><h3>Ver.4 判定ルール</h3><p>①コース別成績 → ②節間気配 → ③当地相性 → ④モーター・ボート → ⑤選手格</p><p>展示STの数値は予想評価に使用しません。</p><p>レースタイプ：🟢 本筋ヒモ荒れ / 🟡 半本線 / 🔴 素直決着</p></section><section class="card"><h3>次の開発項目</h3><p>公式データの取得方法・利用条件を確認し、バックエンドと予想保存DBを接続します。</p><small>このプロトタイプにはAI・リアルタイム取得・自動予想はまだ実装されていません。</small></section></main><script>const venues='桐生 戸田 江戸川 平和島 多摩川 浜名湖 蒲郡 常滑 津 三国 びわこ 住之江 尼崎 鳴門 丸亀 児島 宮島 徳山 下関 若松 芦屋 福岡 唐津 大村'.split(' ');document.querySelector('#venue').innerHTML=venues.map(v=>`<option>${v}</option>`).join('');document.querySelector('#race').innerHTML=Array.from({length:12},(_,i)=>`<option>${i+1}R</option>`).join('');document.querySelector('#check').onclick=()=>{document.querySelector('#status').textContent=`${document.querySelector('#venue').value} ${document.querySelector('#race').value}：データ連携未設定。次の工程で接続します。`}</script></body></html>
